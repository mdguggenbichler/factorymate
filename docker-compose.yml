# FactoryMate — production stack (spec §2.4, §9)
# Single container: Next.js on :3000 proxies /api and /healthz to Go on localhost:8080.
# Joins the existing satisfactory-server Docker network so the backend can reach FRM
# at http://satisfactory-server:8080 (host-mapped :8889 on GuggiRaid).

services:
  factorymate:
    build: .
    restart: unless-stopped
    ports:
      - "${FACTORYMATE_PORT:-3000}:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      DATABASE_PATH: /data/factorymate.db
      FRM_HOST: ${FRM_HOST:-satisfactory-server}
      FRM_PORT: ${FRM_PORT:-8080}
      BACKEND_URL: http://127.0.0.1:8080
    volumes:
      - factorymate-data:/data
    networks:
      - satisfactory-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  factorymate-data:

networks:
  satisfactory-server:
    external: true
    name: ${SATISFACTORY_NETWORK:-satisfactory-server_default}
